name: AFIF-PBX Native (Windows)

on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the installer as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: 2.0.${{ github.run_number }}
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and test the PBX core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - name: Build
        run: dotnet build native/tests/AfifPbx.Tests/AfifPbx.Tests.csproj -c Release 2>&1 | tee build.log
      - name: Test
        run: |
          set -o pipefail
          dotnet test native/tests/AfifPbx.Tests/AfifPbx.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" \
            --blame-hang-timeout 3m 2>&1 | tee test.log
      - name: Branding assets
        if: always()
        run: |
          sudo apt-get install -y -qq librsvg2-bin imagemagick >/dev/null
          mkdir -p brand
          if [ -f branding/logo.png ]; then cp branding/logo.png brand/logo.png; else rsvg-convert -w 1280 branding/logo.svg -o brand/logo.png; fi
          h=$(identify -format %h brand/logo.png); w=$(identify -format %w brand/logo.png)
          if [ -f branding/icon.png ]; then cp branding/icon.png brand/emblem.png; elif [ "$w" -gt $((h*2)) ]; then convert brand/logo.png -crop ${h}x${h}+0+0 +repage brand/emblem.png; else cp brand/logo.png brand/emblem.png; fi
          convert brand/emblem.png -resize 256x256 -background none -gravity center -extent 256x256 -define icon:auto-resize=256,128,64,48,32,24,16 brand/afif-pbx.ico
          convert -size 164x314 gradient:'#13234a'-'#070d1d' \( brand/emblem.png -resize 120x120 \) -gravity center -composite -type TrueColor BMP3:brand/wizard-large.bmp
          convert -size 55x55 xc:'#0b1630' \( brand/emblem.png -resize 47x47 \) -gravity center -composite -type TrueColor BMP3:brand/wizard-small.bmp
          cp branding/logo.svg brand/logo.svg
          ls -l brand
      - uses: actions/upload-artifact@v4
        with: { name: native-branding, path: brand/ }
      - name: Report failures
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('native/tests/AfifPbx.Tests/TestResults/*.trx'):
              root = ET.parse(f).getroot()
              for r in root.iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') != 'Passed':
                      msg = r.find('.//t:Message', ns)
                      st = r.find('.//t:StackTrace', ns)
                      text = ((msg.text if msg is not None else '') + ' | ' + (st.text if st is not None else '')).replace('\n', ' ')[:900]
                      print(f"::error title={r.get('testName')}::{text}")
          EOF
      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp build.log test.log /tmp/ci/ 2>/dev/null || true
          cp native/tests/AfifPbx.Tests/TestResults/*.trx /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci && git init -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "run ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  windows:
    name: Windows service, tray app and installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/download-artifact@v4
        with: { name: native-branding, path: native/dist/branding }
      - name: Place branding
        shell: pwsh
        run: |
          Copy-Item native/dist/branding/logo.png native/src/AfifPbx.Tray/assets/logo.png
          Copy-Item native/dist/branding/afif-pbx.ico native/src/AfifPbx.Tray/assets/afif-pbx.ico
          Copy-Item native/dist/branding/logo.svg native/src/AfifPbx.Server/wwwroot/logo.svg
          Copy-Item native/dist/branding/afif-pbx.ico native/src/AfifPbx.Server/wwwroot/favicon.ico
      - name: Publish service and tray app
        shell: pwsh
        run: |
          dotnet publish native/src/AfifPbx.Server/AfifPbx.Server.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o native/dist/app
          dotnet publish native/src/AfifPbx.Tray/AfifPbx.Tray.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o native/dist/app
          Get-ChildItem native/dist/app -Filter *.exe
      - name: Smoke test the service
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\afif-data"
          $p = Start-Process native/dist/app/AFIF-PBX-Service.exe -ArgumentList "--data `"$data`"" -PassThru -NoNewWindow
          $port = $null
          for ($i = 0; $i -lt 30 -and -not $port; $i++) { Start-Sleep 1; if (Test-Path "$data\http-port.txt") { $port = Get-Content "$data\http-port.txt" } }
          Start-Sleep 3
          $status = Invoke-RestMethod "http://127.0.0.1:$port/api/local/status"
          $status | ConvertTo-Json -Depth 4
          $page = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing
          if ($page.Content -notmatch "AFIF-PBX") { throw "web panel did not load" }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = Invoke-RestMethod "http://127.0.0.1:$port/api/login" -Method Post -ContentType "application/json" -Body '{"user":"admin","password":"admin"}' -WebSession $s
          $ext = Invoke-RestMethod "http://127.0.0.1:$port/api/extensions" -WebSession $s
          if ($ext.Count -lt 1) { throw "no extensions" }
          $wav = Invoke-WebRequest "http://127.0.0.1:$port/api/speech/preview" -Method Post -ContentType "application/json" -Body '{"text":"Welcome to AFIF PBX"}' -WebSession $s -UseBasicParsing
          "Speech preview bytes: $($wav.RawContentLength)"
          if ($wav.RawContentLength -lt 8000) { Write-Warning "Text-to-speech gave little audio on this build machine (no SAPI voices?)" }
          Stop-Process $p.Id -Force
          Get-Content "$data\Logs\*.log" | Select-Object -Last 30
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/dist/scripts | Out-Null
          Copy-Item native/installer/*.ps1 native/dist/scripts/
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$env:VERSION native/installer/afif-pbx-native.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem native/dist/out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: AFIF-PBX-Native-Setup
          path: native/dist/out/*.exe
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $exe = Get-ChildItem native/dist/out/*.exe | Select-Object -First 1
          gh release create "native-v$env:VERSION" $exe.FullName --title "AFIF-PBX Native $env:VERSION" --notes "AFIF-PBX for Windows 11 — native Windows service, no WSL. Run the installer as administrator."
