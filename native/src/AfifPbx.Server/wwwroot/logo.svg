<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <!-- Placeholder AFIF-PBX mark. Replace branding/logo.png with the official AFIF-TECH logo. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d7f5"/>
    </linearGradient>
  </defs>
  <!-- hexagon emblem -->
  <g transform="translate(100 100)">
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="#0b1630" stroke="url(#g)" stroke-width="8"/>
    <!-- handset -->
    <path d="M-30,-22 c6,-8 16,-8 20,-2 l7,12 c3,5 1,11 -4,14 l-6,3 c4,10 12,19 22,24 l4,-6 c3,-5 9,-7 14,-4 l12,7 c6,4 6,14 -1,20 c-10,9 -26,10 -42,-1 c-17,-12 -30,-30 -32,-46 c-1,-8 1,-15 6,-21 z" fill="url(#g)"/>
    <!-- signal arcs -->
    <path d="M14,-34 a26,26 0 0 1 22,22" fill="none" stroke="#38e1ff" stroke-width="7" stroke-linecap="round"/>
    <path d="M16,-54 a46,46 0 0 1 40,40" fill="none" stroke="#38e1ff" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  </g>
  <text x="200" y="112" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="2" fill="url(#t)">AFIF<tspan fill="#38e1ff">-</tspan>PBX</text>
  <text x="204" y="152" font-family="Segoe UI, Montserrat, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="9" fill="#7fa6d9">BY AFIF-TECH</text>
</svg>
